name: Build

# Every push and pull request: build the universal, ad-hoc signed app and keep
# the zip as a workflow artifact. A tag `v*` additionally publishes a GitHub
# release with the zip and updates the Homebrew cask (version + sha256).
# No Developer ID signing or notarization: users remove the quarantine flag
# (see README) or install through the cask, which does it for them.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Not evaluated for tag pushes, so releases always build.
    paths-ignore: &docs ["**.md", "docs/**", "LICENSE", "Casks/**"]
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

# A newer push supersedes a running branch/PR build; tag builds always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen (pinned prebuilt, no Homebrew)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Build release zip
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          make release VERSION="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check architectures and signature
        run: |
          APP=build/Build/Products/Release/ARWQuickLook.app
          for bin in "$APP/Contents/MacOS/ARWQuickLook" \
                     "$APP/Contents/PlugIns/ARWPreview.appex/Contents/MacOS/ARWPreview" \
                     "$APP/Contents/PlugIns/ARWThumbnail.appex/Contents/MacOS/ARWThumbnail"; do
            lipo -archs "$bin" | grep -q "x86_64 arm64" || { echo "not universal: $bin"; exit 1; }
          done
          codesign --verify --deep --strict "$APP"

      - uses: actions/upload-artifact@v7
        with:
          name: ARWQuickLook-${{ env.VERSION }}
          path: build/ARWQuickLook-${{ env.VERSION }}.zip
          if-no-files-found: error
          compression-level: 0 # already a zip

  # Separate job so only this short Linux job ever holds a write token.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "ARW QuickLook ${GITHUB_REF_NAME#v}" --generate-notes

      # Pushes made with GITHUB_TOKEN never trigger workflows, so no build loop.
      - name: Update Homebrew cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum "dist/ARWQuickLook-${VERSION}.zip" | cut -d' ' -f1)
          sed -i -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
                 -e "s/^  sha256 .*/  sha256 \"${SHA}\"/" Casks/arw-quicklook.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && { echo "cask unchanged"; exit 0; }
          git commit -am "cask: arw-quicklook ${VERSION}"
          git push origin main
