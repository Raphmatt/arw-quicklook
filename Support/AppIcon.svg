<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ARW QuickLook app icon (master). Rendered to the AppIcon asset
       catalog by `make icon`. "ARW" is Inter Black (SIL OFL 1.1) converted
       to outlines, so rendering needs no installed font. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#d9dde4"/>
    </linearGradient>
    <!-- The soft shadow macOS app icons carry in their artwork -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 px body, 100 px margin, ~22.5 % corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#000000" stroke-opacity="0.08"/>
  <!-- Focus-frame corners; the bottom-right one is a magnifier (Quick Look) -->
